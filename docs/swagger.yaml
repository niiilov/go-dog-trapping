basePath: /api
definitions:
  dto.AcceptExternalUserRequest:
    description: Структура для принятия внешнего пользователя. Все поля обязательны
      к заполнению ID берётся из param. Для роли admin, contractor необязательно заполнять
      SourceID
    properties:
      full_name:
        type: string
      id:
        type: integer
      role:
        type: string
      role_name:
        type: string
      source_id:
        type: string
    type: object
  dto.Applicant:
    properties:
      district_id:
        type: string
      full_name:
        type: string
      id:
        type: string
      position:
        type: string
    type: object
  dto.AuthCredentials:
    description: Структура для авторизации пользователя. Все поля обязательны к заполнению
    properties:
      login:
        description: Логин для входа в систему, должен быть уникальным
        type: string
      password:
        description: Пароль для входа в систему
        type: string
    type: object
  dto.AuthResponse:
    description: Структура для ответа с данными пользователя
    properties:
      message:
        description: просто сообщение
        type: string
      status:
        description: обычно ok  при ошибках error
        type: string
      tokens:
        allOf:
        - $ref: '#/definitions/dto.AuthTokens'
        description: токены авторизации
      user:
        allOf:
        - $ref: '#/definitions/dto.UserProfile'
        description: данные пользователя
    type: object
  dto.AuthTokens:
    description: Структура c токенами
    properties:
      access_token:
        type: string
      refhresh_token:
        type: string
    type: object
  dto.ChangeStatusRequestDTO:
    properties:
      id:
        description: ID заявки
        type: string
      status:
        description: Новый статус заявки (новая, в работе, выполнена, отменена)
        type: string
    type: object
  dto.CreateApplicantDTO:
    properties:
      district_id:
        type: string
      full_name:
        type: string
      position:
        type: string
    type: object
  dto.CreateRequestDTO:
    properties:
      address:
        type: string
      applicant_id:
        type: string
      behavior:
        type: string
      contact_person:
        type: string
      district_id:
        type: string
      dogs_count:
        type: integer
      number:
        type: integer
      ter_otdel_id:
        type: string
      urgency:
        type: string
    type: object
  dto.CreateTerOtdelDTO:
    properties:
      district_id:
        type: string
      name:
        type: string
    type: object
  dto.CreateUserDTO:
    properties:
      district_id:
        type: string
      full_name:
        type: string
      login:
        type: string
      password:
        type: string
      role_id:
        type: string
      ter_otdel_id:
        type: string
    type: object
  dto.District:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.ExternalUser:
    description: Структура для создания внешнего пользователя. Все поля обязательны
      к заполнению кроме Patronymic, PhoneNumber, City, DateOfBirth, Bio
    properties:
      bio:
        type: string
      city:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      is_accepted:
        type: boolean
      last_name:
        type: string
      password:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      username:
        type: string
    type: object
  dto.Generate:
    properties:
      requests_ids:
        items:
          type: string
        type: array
    type: object
  dto.GetUserDTO:
    properties:
      district_id:
        type: string
      full_name:
        type: string
      id:
        type: string
      login:
        type: string
      role_id:
        type: string
      ter_otdel_id:
        type: string
    type: object
  dto.GetUserDTOResponse:
    properties:
      status:
        type: string
      users:
        items:
          $ref: '#/definitions/dto.GetUserDTO'
        type: array
    type: object
  dto.Request:
    properties:
      act_file:
        type: string
      address:
        type: string
      applicant_id:
        type: string
      behavior:
        type: string
      contact_person:
        type: string
      created_at:
        type: string
      district_id:
        type: string
      dogs_count:
        type: integer
      id:
        type: string
      number:
        type: integer
      status:
        type: string
      ter_otdel_id:
        type: string
      urgency:
        type: string
    type: object
  dto.Response:
    description: Структура для ответа с где обычно ок и сообщние
    properties:
      message:
        description: просто сообщение
        type: string
      status:
        description: обычно ok  при ошибках error
        type: string
    type: object
  dto.ResponseUrl:
    description: Структура для ответа с где обычно ок и url
    properties:
      status:
        description: обычно ok  при ошибках error
        type: string
      url:
        description: url на скаччивание файла
        type: string
    type: object
  dto.Role:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  dto.TerOtdel:
    properties:
      district_id:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  dto.UserProfile:
    description: Структура для получения профиля пользователя. Все поля обязательны
      к заполнению
    properties:
      district_id:
        description: ID района
        type: string
      district_name:
        description: Название района
        type: string
      full_name:
        description: Полное имя или название организации
        type: string
      id:
        description: ID пользователя
        type: string
      login:
        description: Логин для входа в систему, должен быть уникальным
        type: string
      role_name:
        description: Название роли пользователя
        type: string
      roleID:
        description: Роль пользователя, например, "admin", "user", "otdel" и т.д.
        type: string
      ter_otdel_id:
        description: ID территориального отдела
        type: string
      ter_otdel_name:
        description: Название территориального отдела
        type: string
    type: object
host: localhost:8091
info:
  contact: {}
  description: API сервиса для отлова бродячих собак.
  title: Go Dog Trapping API
  version: "1.0"
paths:
  /api/applicants:
    post:
      consumes:
      - application/json
      description: Создание заявки на отлов бродячей собаки
      parameters:
      - description: Applicant information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateApplicantDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Заявка успешно создана.
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Ошибка в данных заявки.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при создании заявки.
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Create Applicant
      tags:
      - Applicants
  /api/applicants/{districtID}:
    get:
      consumes:
      - application/json
      description: Получение заявок по ID района
      parameters:
      - description: District ID
        in: path
        name: districtID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Заявки по району
          schema:
            items:
              $ref: '#/definitions/dto.Applicant'
            type: array
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при получении заявок.
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Get Applicants by District ID
      tags:
      - Applicants
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Авторизация пользователя.
      parameters:
      - description: Login information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AuthCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.AuthResponse'
      summary: Login
      tags:
      - Auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Регистрация нового пользователя.
      parameters:
      - description: User information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register
      tags:
      - Auth
  /api/districts:
    get:
      description: Get all districts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.District'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all districts
      tags:
      - districts
    post:
      consumes:
      - application/json
      description: Create a new district
      parameters:
      - description: District
        in: body
        name: district
        required: true
        schema:
          $ref: '#/definitions/dto.District'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.District'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a district
      tags:
      - districts
  /api/districts/{id}:
    delete:
      description: Delete a district by ID
      parameters:
      - description: District ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a district
      tags:
      - districts
  /api/external/{id}:
    put:
      consumes:
      - application/json
      description: Accepted external user to dogs
      parameters:
      - description: External user to update
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.AcceptExternalUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Accept internal systen external user
      tags:
      - external-users
  /api/external/users:
    post:
      consumes:
      - application/json
      description: Create external user
      parameters:
      - description: External user to create
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.ExternalUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create external user
      tags:
      - external-users
  /api/external/users/{id}:
    put:
      consumes:
      - application/json
      description: Change Accepted external user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: ChangeDisAccept external user
      tags:
      - external-users
  /api/external/users/{id}/activate:
    put:
      consumes:
      - application/json
      description: Change Accepted external user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: ChangeAccept external user
      tags:
      - external-users
  /api/generate:
    post:
      consumes:
      - application/json
      description: Генерация документов по заявкам
      parameters:
      - description: Запрос на генерацию документов
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Generate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Генерация документов
      tags:
      - Генерация
  /api/requests:
    get:
      description: Получение заявок на отлов бродячих собак по ID территориального
        отдела или района.
      produces:
      - application/json
      responses:
        "200":
          description: Список заявок
          schema:
            items:
              $ref: '#/definitions/dto.Request'
            type: array
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при получении заявок.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get Requests
      tags:
      - Requests
    post:
      consumes:
      - application/json
      description: Создание заявки на отлов бродячих собак.
      parameters:
      - description: Создание заявки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Заявка успешно создана
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при создании заявки.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Create Request
      tags:
      - Requests
  /api/requests/{id}:
    delete:
      consumes:
      - application/json
      description: Удаление заявки на отлов бродячих собак.
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Заявка успешно удалена
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при удалении заявки.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Delete Request
      tags:
      - Requests
  /api/requests/act:
    post:
      consumes:
      - application/json
      description: Добавление акта об отлове бродячих собак.
      parameters:
      - description: Act File
        in: formData
        name: file
        required: true
        type: file
      - description: Request ID
        in: formData
        name: request_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Акт успешно добавлен
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при добавлении акта.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Add Act File
      tags:
      - Requests
  /api/requests/act/{filename}:
    get:
      description: Получение URL для скачивания файла акта
      parameters:
      - description: Filename
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseUrl'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при получении запросов.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Download Act File URL
      tags:
      - Requests
  /api/requests/status:
    put:
      consumes:
      - application/json
      description: Изменение статуса заявки на отлов бродячих собак.
      parameters:
      - description: Изменение статуса заявки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangeStatusRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Статус заявки успешно изменен
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при изменении статуса заявки.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Change Request Status
      tags:
      - Requests
  /api/roles:
    get:
      description: Получение всех ролей
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.Role'
            type: array
        "500":
          description: Ошибка при получении ролей.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get all roles
      tags:
      - roles
  /api/ter-otdel:
    get:
      description: Get all TerOtdels
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TerOtdel'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all TerOtdels
    post:
      consumes:
      - application/json
      description: Create a new TerOtdel
      parameters:
      - description: TerOtdel
        in: body
        name: terOtdel
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTerOtdelDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new TerOtdel
  /api/ter-otdel/{id}:
    delete:
      description: Delete a TerOtdel
      parameters:
      - description: TerOtdel ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete a TerOtdel
  /api/users:
    get:
      consumes:
      - application/json
      description: Получить список всех пользователей
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetUserDTOResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Получить список пользователей
      tags:
      - users
  /api/users/{id}:
    delete:
      consumes:
      - application/json
      description: Удалить пользователя по ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Удалить пользователя
      tags:
      - users
  /auth/refresh:
    post:
      description: Обновление токенов доступа и обновления.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthTokens'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.AuthTokens'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.AuthTokens'
      security:
      - BearerAuth: []
      summary: Refresh Token
      tags:
      - Auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
