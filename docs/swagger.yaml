basePath: /api
definitions:
  dto.AcceptExternalUserRequest:
    description: Структура для принятия внешнего пользователя. Все поля обязательны
      к заполнению ID берётся из param. Для роли admin, contractor необязательно заполнять
      SourceID
    properties:
      full_name:
        type: string
      id:
        type: string
      role:
        type: string
      role_name:
        type: string
      source_id:
        type: string
    type: object
  dto.Account:
    description: Структура для создания учетной записи пользователя. Все поля обязательны
      к заполнению
    properties:
      full_name:
        description: Полное имя или название организации
        type: string
      id:
        description: ID пользователя
        type: string
      login:
        description: Логин для входа в систему, должен быть уникальным
        type: string
      password:
        description: Пароль для входа в систему
        type: string
      role:
        description: Роль пользователя, например, "admin", "user", "otdel" и т.д.
        type: string
      role_name:
        description: Название роли пользователя
        type: string
      source_id:
        description: id тер отдела
        type: string
    type: object
  dto.AddNewTerOtdel:
    properties:
      name:
        type: string
    type: object
  dto.Applicant:
    description: Заявитель. Поле name игнорируется при создании заявки.
    properties:
      id:
        description: уникальный идентификатор заявителя при Post запросе на создание
          заявки ОБЯЗАТЕЛЕН
        type: string
      is_permanent:
        description: Является ли заявитель постоянным
        type: boolean
      name:
        description: Название заявителя игнорируется при создании заявки
        type: string
    type: object
  dto.AuthCredentials:
    description: Структура для авторизации пользователя. Все поля обязательны к заполнению
    properties:
      login:
        description: Логин для входа в систему, должен быть уникальным
        type: string
      password:
        description: Пароль для входа в систему
        type: string
    type: object
  dto.AuthResponse:
    description: Структура для ответа с данными пользователя
    properties:
      message:
        description: просто сообщение
        type: string
      status:
        description: обычно ok  при ошибках error
        type: string
      tokens:
        allOf:
        - $ref: '#/definitions/dto.AuthTokens'
        description: токены авторизации
      user:
        allOf:
        - $ref: '#/definitions/dto.UserProfile'
        description: данные пользователя
    type: object
  dto.AuthTokens:
    description: Структура c токенами
    properties:
      access_token:
        type: string
      refhresh_token:
        type: string
    type: object
  dto.ChangePasswordRequest:
    description: Структура для смены пароля пользователя. Все поля обязательны к заполнению
    properties:
      login:
        description: Логин для входа в систему, должен быть уникальным
        type: string
      new_password:
        description: Новый пароль для входа в систему
        type: string
      old_password:
        description: Старый пароль для входа в систему
        type: string
    type: object
  dto.ChangeProfileRequest:
    description: Структура для отправки запроса на изменение данных профиля
    properties:
      full_name:
        description: Полное имя или название организации
        type: string
      id:
        description: ID пользователя
        type: string
      login:
        description: Логин для входа в систему, должен быть уникальным
        type: string
    type: object
  dto.ChangeStatusRequest:
    properties:
      id:
        description: ID заявки
        type: string
      status:
        description: Новый статус заявки (новая, в работе, выполнена, отменена)
        type: string
    type: object
  dto.ExternalUser:
    description: Структура для создания внешнего пользователя. Все поля обязательны
      к заполнению кроме Patronymic, PhoneNumber, City, DateOfBirth, Bio
    properties:
      bio:
        type: string
      city:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_accepted:
        type: boolean
      last_name:
        type: string
      password:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      username:
        type: string
    type: object
  dto.GenerateMultipleRequestByDate:
    description: генерация документа с несколькими заявками.
    properties:
      date_from:
        description: Дата с которой нужно выбрать заявки
        type: string
      date_to:
        description: Дата по которую нужно выбрать заявки
        type: string
    type: object
  dto.GenerateMultipleRequestByID:
    description: генерация документа с несколькими заявками по ID
    properties:
      ids:
        description: Список ID заявок которые нужно включить в документ
        items:
          type: string
        type: array
    type: object
  dto.GetExternalUser:
    description: Структура для пполучения внешних пользователей
    properties:
      bio:
        type: string
      city:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_accepted:
        type: boolean
      last_name:
        type: string
      patronymic:
        type: string
      phone_number:
        type: string
      username:
        type: string
    type: object
  dto.RequestFull:
    description: Полная информация о заявке на отлов бродячей собаки. Поля id, number,
      status и created_at игнорируются при создании заявки.
    properties:
      address:
        description: Адрес, где была замечена бродячая собака
        type: string
      applicant:
        allOf:
        - $ref: '#/definitions/dto.Source'
        description: '"!!!!ВАЖНО название поля json applicant и source поменяты местами!!"Источник
          информации от кого был получен запрос ID находится в справочнике'
      behavior:
        description: Поведение собаки
        type: string
      contact_person:
        description: Контактные данные
        type: string
      created_at:
        description: Дата и время создания заявки генерируется автоматически
        type: string
      dogs_count:
        description: Количество собак
        type: integer
      id:
        description: уникальный идентификатор заявки при Post запросе не указывается
        type: string
      number:
        description: уникальный номер заявки, генерируется автоматически при создании
          заявки
        type: string
      source:
        allOf:
        - $ref: '#/definitions/dto.Applicant'
        description: '"!!!!ВАЖНО название поля json applicant и source поменяты местами!!"Заявитель
          ID находится в справочнике'
      status:
        description: Статус заявки (новая, в работе, выполнена, отменена) генерируется
          после создания заявки
        type: string
      urgency:
        description: срочность
        type: string
    type: object
  dto.Response:
    description: Структура для ответа с где обычно ок и сообщние
    properties:
      message:
        description: просто сообщение
        type: string
      status:
        description: обычно ok  при ошибках error
        type: string
    type: object
  dto.ResponseUrl:
    description: Структура для ответа с где обычно ок и url
    properties:
      status:
        description: обычно ok  при ошибках error
        type: string
      url:
        description: url на скаччивание файла
        type: string
    type: object
  dto.Source:
    description: Источник информации от кого был получен запрос. Поле name игнорируется
      при создании заявки.
    properties:
      id:
        description: уникальный идентификатор источника при Post запросе на создание
          заявки ОБЯЗАТЕЛЕН
        type: string
      name:
        description: Название источника игнорируется при создании заявки
        type: string
    type: object
  dto.UserProfile:
    description: Структура для получения профиля пользователя. Все поля обязательны
      к заполнению
    properties:
      full_name:
        description: Полное имя или название организации
        type: string
      id:
        description: ID пользователя
        type: string
      login:
        description: Логин для входа в систему, должен быть уникальным
        type: string
      role:
        description: Роль пользователя, например, "admin", "user", "otdel" и т.д.
        type: string
      role_name:
        description: Название роли пользователя
        type: string
    type: object
host: localhost:8091
info:
  contact: {}
  description: API сервиса для отлова бродячих собак.
  title: Go Dog Trapping API
  version: "1.0"
paths:
  /api/applicants:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.Applicant'
            type: array
        "500":
          description: Ошибка при получении заявителей.
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Получить список заявителей
      tags:
      - applicants
  /api/external/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.GetExternalUser'
            type: array
        "500":
          description: Ошибка при получении внешних пользователей.
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Получить список внешних пользователей
      tags:
      - external-users
    post:
      consumes:
      - application/json
      description: Create external user
      parameters:
      - description: External user to create
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.ExternalUser'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create external user
      tags:
      - external-users
  /api/external/users/{id}:
    put:
      consumes:
      - application/json
      description: Change Accepted external user
      parameters:
      - description: External user to update
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.AcceptExternalUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: ChangeAccept external user
      tags:
      - external-users
  /api/sources:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.Source'
            type: array
        "500":
          description: Ошибка при получении территориальных отделов.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Получить список территориальных отделов
      tags:
      - applicants
    post:
      consumes:
      - application/json
      parameters:
      - description: New territorial department
        in: body
        name: terOtdel
        required: true
        schema:
          $ref: '#/definitions/dto.AddNewTerOtdel'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Добавить новый тер отдел
      tags:
      - territorial-departments
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Смена данных профлия пользователя.
      parameters:
      - description: Change Profile information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangeProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Информация успешна изменена.
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при cмене  данных.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Change Profile Info
      tags:
      - User
  /auth/refresh:
    post:
      description: Обновление токенов доступа и обновления.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthTokens'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.AuthTokens'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.AuthTokens'
      security:
      - BearerAuth: []
      summary: Refresh Token
      tags:
      - Auth
  /auth/sign-in:
    post:
      consumes:
      - application/json
      description: Авторизация пользователя.
      parameters:
      - description: Account credentials
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/dto.AuthCredentials'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.AuthResponse'
      summary: Sign In
      tags:
      - Auth
  /auth/sign-up:
    post:
      consumes:
      - application/json
      description: Регистрация нового пользователя.
      parameters:
      - description: Account information
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/dto.Account'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.AuthResponse'
      summary: Sign Up
      tags:
      - Auth
  /requests:
    get:
      description: Получение всех запросов на отлов бродячих собак. Доступно только
        для районных администраторов.
      produces:
      - application/json
      responses:
        "200":
          description: Все заявки"  query param otdel_id - для получения заявок по
            отделу, доступно только для  админа
          schema:
            items:
              $ref: '#/definitions/dto.RequestFull'
            type: array
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при получении запросов.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get All Requests
      tags:
      - Requests
    post:
      consumes:
      - application/json
      description: Отправка запроса на отлов бродячей собаки. Поля source_id и applicant_id
        заполнять ID из справочников. Поля name в этих полях игнорируются при отправке
        запроса. Доступно для всех авторизованных пользователей.
      parameters:
      - description: Request information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RequestFull'
      produces:
      - application/json
      responses:
        "200":
          description: Запрос успешно отправлен
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при отправке запроса
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Send Request
      tags:
      - Requests
  /requests/{id}:
    delete:
      description: Удаление заявки на отлов бродячей собаки по ID. Доступно только
        для районных администраторов.
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Заявка успешно удалена.
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при удалении заявки.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Delete Request
      tags:
      - Requests
  /requests/change-status:
    post:
      consumes:
      - application/json
      description: Изменение статуса заявки на отлов бродячей собаки. Поля id и status
        обязательны к заполнению.
      parameters:
      - description: Change Status Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangeStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Статус заявки успешно изменен.
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при изменении статуса заявки.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Change Status Request
      tags:
      - Requests
  /requests/download_act:
    get:
      description: Получение URL для скачивания файла акта выполненого отлова в формате
        .docx. Требуется параметры number и year в query, номер заявки и год. Доступно
        для всех авторизованных пользователей.
      parameters:
      - description: Request Number
        in: query
        name: number
        required: true
        type: string
      - description: Request Year
        in: query
        name: year
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseUrl'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при получении запросов.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Download Act File URL
      tags:
      - Requests
  /requests/download_multiDate:
    post:
      consumes:
      - application/json
      description: Генерация нескольких заявок на отлов бродячих собак в одном файле.
        Требуется передать диапазон дат. Доступно только для районных администраторов.
      parameters:
      - description: Generate Multiple Requests By Date
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GenerateMultipleRequestByDate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseUrl'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при генерации запросов.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Generate Multiple Requests By Date
      tags:
      - Requests
  /requests/download_multiID:
    post:
      consumes:
      - application/json
      description: Генерация нескольких заявок на отлов бродячих собак в одном файле.
        Требуется передать массив ID заявок. Доступно только для районных администраторов.
      parameters:
      - description: Generate Multiple Requests By IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GenerateMultipleRequestByID'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseUrl'
        "400":
          description: Ошибка в данных запроса.
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Ошибка при генерации запросов.
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Generate Multiple Requests By IDs
      tags:
      - Requests
  /requests/download_request:
    get:
      description: Получение URL для скачивания файла заявки в формате .docx. Требуется
        параметр number в query, номер заявки. Доступно для всех авторизованных пользователей.
      parameters:
      - description: Request Number
        in: query
        name: number
        required: true
        type: string
      - description: Request Year
        in: query
        name: year
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ResponseUrl'
        "400":
          description: Ошибка в данных запроса.
