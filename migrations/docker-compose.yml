services:
  postgres:
    image: postgres:15
    container_name: postgres-sobaki
    environment:
      POSTGRES_DB: sobaki
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    networks:
            - my-bridge-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sobaki"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
    my-bridge-network:
        name: my-bridge-network
        external: true
          
volumes:
  postgres_data:
    driver: local
